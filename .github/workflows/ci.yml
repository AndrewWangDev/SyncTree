name: CI & Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 显式限制全局最小权限为只读 (Principle of Least Privilege)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-security:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linters & Security Checkers
        run: |
          pip install flake8 bandit

      - name: Run Flake8 (Syntax & Style Check)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all warnings as non-fatal
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Bandit (Security Vulnerability AST Scan)
        run: |
          bandit -r core ui main.py -x tests --severity-level medium

  test-matrix:
    name: Test on ${{ matrix.os }} (Py ${{ matrix.python-version }})
    needs: lint-and-security
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies (Linux Qt Offscreen Libraries)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Execute Automated Test Suite (Headless Offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests -v --cov=core --cov=ui --cov-report=xml

      - name: Upload Test Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
