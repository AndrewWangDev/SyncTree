name: 🐛 Bug Report
description: Report an unexpected error, crash, or incorrect behavior in SyncTree.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill in the details below to help us reproduce and resolve the issue quickly.
        *If this involves a security vulnerability, please refer to our [Security Policy](https://github.com/AndrewWangDev/SyncTree/security/policy).*
  - type: textarea
    id: problem-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Detailed step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Open repository at '...'
        2. Stage file '...'
        3. Click button '...'
        4. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: "Operating system, Python version, Git version, and SyncTree release/commit."
      placeholder: "Windows 11 (23H2), Python 3.10.12, Git 2.43.0, SyncTree v2.0.0"
    validations:
      required: true
  - type: textarea
    id: logs-traceback
    attributes:
      label: Terminal Logs / Traceback
      description: Paste any terminal errors, traceback, or stdout messages.
      render: shell
  - type: checkboxes
    id: checklists
    attributes:
      label: Confirmation Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am using the latest release or latest main branch.
          required: true
